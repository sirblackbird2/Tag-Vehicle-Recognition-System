<!DOCTYPE html>
<html>
<head>
    <title>Live Vehicle Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #111;
            color: #eee;
            text-align: center;
        }
        h1 {
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        video, canvas {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 2px solid #444;
            border-radius: 8px;
            background: #000;
        }
        .controls {
            margin: 20px 0;
        }
        .btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-start {
            background: #00ff88;
            color: #111;
        }
        .btn-stop {
            background: #ff4444;
            color: #fff;
        }
        .btn-start:hover {
            background: #00cc66;
        }
        .btn-stop:hover {
            background: #cc0000;
        }
        .results {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }
        .vehicle {
            background: #333;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #00ff88;
            border-radius: 4px;
        }
        .plate {
            color: #ffaa00;
            font-weight: bold;
        }
        #status {
            color: #00ff88;
            margin: 10px 0;
        }
        .scanning {
            color: #ffaa00;
            font-weight: bold;
        }
        .error {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Vehicle Scanner</h1>
        <p id="status">Click "Start Camera" to begin.</p>

        <video id="video" autoplay playsinline style="display:none;"></video>
        <canvas id="canvas"></canvas>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">Start Camera</button>
            <button id="stopBtn" class="btn btn-stop" disabled>Stop</button>
            <button id="scanBtn" class="btn btn-start" disabled>Start Scanning</button>
        </div>

        <div class="results" id="results">
            <h3>Detection Results</h3>
            <p id="resultText">Waiting for scan...</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const scanBtn = document.getElementById('scanBtn');
        const statusEl = document.getElementById('status');
        const resultText = document.getElementById('resultText');

        let stream = null;
        let isScanning = false;
        let intervalId = null;

        // --- Camera Controls ---
        async function startCamera() {
            try {
                statusEl.textContent = 'Accessing camera...';
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                await video.play();

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                startBtn.disabled = true;
                stopBtn.disabled = false;
                scanBtn.disabled = false;
                statusEl.textContent = 'Camera ready. Click "Start Scanning" to begin.';
            } catch (err) {
                statusEl.textContent = '❌ Failed to access camera: ' + err.message;
                alert('Could not access camera. Please allow camera permissions.');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            isScanning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            scanBtn.disabled = true;
            scanBtn.textContent = 'Start Scanning';
            statusEl.textContent = 'Camera stopped.';
        }

        // --- Scan Logic ---
        function captureAndSend() {
            if (!stream || !video.videoWidth) {
                statusEl.textContent = '⚠️ Camera not ready.';
                return;
            }

            // Draw current frame
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert to blob
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    statusEl.textContent = '❌ Failed to capture frame.';
                    return;
                }

                statusEl.textContent = '⏳ Sending to server...';

                const formData = new FormData();
                formData.append('file', blob, 'frame.jpg');

                try {
                    const response = await fetch('API_URL_PLACEHOLDER/predict', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status}`);
                    }

                    const data = await response.json();
                    displayResults(data);
                    statusEl.textContent = '✅ Detection complete.';

                } catch (error) {
                    console.error('Error:', error);
                    statusEl.textContent = `❌ Error: ${error.message}`;
                    resultText.innerText = `Error: ${error.message}`;
                }
            }, 'image/jpeg', 0.7);
        }

        function displayResults(data) {
            let html = '';
            if (data.vehicles && data.vehicles.length > 0) {
                html += `<p>Found <strong>${data.total}</strong> vehicle(s):</p>`;
                data.vehicles.forEach((vehicle, index) => {
                    html += `
                        <div class="vehicle">
                            <strong>${vehicle.type}</strong> (${Math.round(vehicle.confidence * 100)}% confidence)<br>
                            License Plate: <span class="plate">${vehicle.plate || '❌ Not detected'}</span>
                        </div>
                    `;
                });
            } else {
                html = `<p>No vehicles detected. Try adjusting the camera angle.</p>`;
            }
            resultText.innerHTML = html;
        }

        // --- Toggle Scanning ---
        function toggleScanning() {
            if (isScanning) {
                clearInterval(intervalId);
                intervalId = null;
                isScanning = false;
                scanBtn.textContent = 'Start Scanning';
                statusEl.textContent = 'Scanning paused.';
            } else {
                // Capture immediately, then every 2 seconds
                captureAndSend();
                intervalId = setInterval(captureAndSend, 2000);
                isScanning = true;
                scanBtn.textContent = 'Stop Scanning';
                statusEl.textContent = '🔍 Scanning... (every 2 seconds)';
            }
        }

        // --- Event Listenerss ---
        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);
        scanBtn.addEventListener('click', toggleScanning);

        // Auto-start camera on page load
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
